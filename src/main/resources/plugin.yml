name: PigGod
version: '${version}'
main: com.example.piggod.PigGodPlugin
author: acc0-ga
description: Bilibili Pig God meme - hard compat 1.12 ~ 26.x
# 不写 api-version，便于 1.12 加载；1.13+ 服务器也能识别

commands:
  piggod:
    description: Summon Pig God
    usage: /piggod
    permission: piggod.use
    aliases: [猪神, pgod]

permissions:
  piggod.use:
    description: Allow /piggod
    default: true
name: PigGod
version: '${version}'
main: com.example.piggod.PigGodPlugin
# api-version 设为 1.13 可在较广范围加载；过低的 1.12 服务器仍可能不支持现代 API
api-version: '1.13'
author: acc0-ga
description: Bilibili Pig God (猪神) meme - best-effort multi-version

commands:
  piggod:
    description: 召唤猪神 / 猪神来电
    usage: /piggod
    permission: piggod.use
    aliases: [猪神, pgod]

permissions:
  piggod.use:
    description: 允许使用 /piggod 指令
    default: true